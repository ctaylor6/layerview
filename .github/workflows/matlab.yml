name: MATLAB validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Computer_Vision_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox
      - name: Run tests and registration demo
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); results = runtests('tests'); assertSuccess(results); c = layerview.defaultConfig(); c.makePlots = false; run_layerview(c);
      - name: Save demo report
        uses: actions/upload-artifact@v4
        with:
          name: registration-demo-report
          path: outputs/processed_demo/report.json
          if-no-files-found: error
